spring.application.name=payment
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5434/payment
spring.datasource.username=payment
spring.datasource.password=payment

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payment
spring.kafka.consumer.auto-offset-reset=earliest

cards.base-url=http://localhost:8080
cards.connect-timeout=2s
cards.read-timeout=5s

app.kafka.transfer-completed-topic=transfer.completed
app.kafka.transfer-failed-topic=transfer.failed

app.outbox.relay-delay-ms=500

# JWT: cards issues tokens at POST /api/auth/login, payment only verifies them (shared HS256 secret)
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
app.jwt.ttl=1h
