spring.application.name=cards

spring.datasource.url=jdbc:postgresql://localhost:5432/cards
spring.datasource.username=cards
spring.datasource.password=cards

spring.jpa.hibernate.ddl-auto=validate

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cards
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.transfer-completed-topic=transfer.completed
app.kafka.transfer-failed-topic=transfer.failed

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.card-number-hash-secret=${APP_CARD_NUMBER_HASH_SECRET:dev-only-change-me}

# JWT: cards issues tokens at POST /api/auth/login, payment only verifies them (shared HS256 secret)
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
app.jwt.ttl=1h

# demo user for POST /api/auth/login
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password=${APP_AUTH_PASSWORD:admin}
